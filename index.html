            bubbles: true, cancelable: true, composed: true,
            key: event.key, code: event.code, location: event.location,
            repeat: event.repeat, ctrlKey: event.ctrlKey,
            shiftKey: event.shiftKey, altKey: event.altKey, metaKey: event.metaKey
          });
          Object.defineProperty(clone, forwarded, { value: true });
          canvas.dispatchEvent(clone);
        }, true);
      };
      installCanvasInputBridge();
      document.getElementById('game-title').textContent = 'THE BALD BRAWLER';
      // No saved game preference is visible here: follow the browser's preferred language.
      const zh = false;
      document.documentElement.lang = 'de';
      status.textContent = zh ? '正在加载…' : 'Ring wird aufgebaut…';
      retry.textContent = zh ? '重试' : 'Erneut versuchen';
      progress.setAttribute('aria-label', zh ? '下载进度' : 'Ladefortschritt');
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      let loaderAudioContext = null;
      const playLoaderTone = (frequency, duration, offset = 0) => {
        try {
          const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextCtor) return;
          loaderAudioContext ||= new AudioContextCtor();
          if (loaderAudioContext.state === 'suspended') loaderAudioContext.resume();
          const now = loaderAudioContext.currentTime + offset;
          const oscillator = loaderAudioContext.createOscillator();
          const gain = loaderAudioContext.createGain();
          oscillator.type = 'square';
          oscillator.frequency.setValueAtTime(frequency, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.055, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          oscillator.connect(gain).connect(loaderAudioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + duration + 0.02);
        } catch (_) {
          // Browser policies may reject audio until a gesture; loading continues silently.
        }
      };
      const playLoaderJingle = () => {
        playLoaderTone(520, 0.08);
        playLoaderTone(760, 0.10, 0.075);
        playLoaderTone(1040, 0.13, 0.16);
      };
      window.addEventListener('pointerdown', () => playLoaderTone(420, 0.055), { once: true, passive: true });
      retry.addEventListener('click', () => {
        playLoaderJingle();
        window.location.reload();
      });
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? (zh ? '暂未看到新的加载进度。可以继续等待，或重试。' : 'Gerade kein Ladefortschritt. Du kannst warten oder es erneut versuchen.')
          : (zh ? '仍在加载。可以继续等待，或重试。' : 'Lädt noch. Du kannst warten oder es erneut versuchen.');
        if (notice.textContent !== message) notice.textContent = message;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      // Time alone cannot prove failure: downloads and WASM compilation may be slow.
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        const detail = error && error.message ? ` (${error.message})` : '';
        status.textContent = zh ? `游戏加载失败，请重试。${detail}` : `Das Spiel konnte nicht geladen werden. Bitte erneut versuchen.${detail}`;
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      // Some Godot bootstrap promises do not forward download/compile failures.
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        // Repeated/unknown totals do not renew liveness; growing byte counts do.
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = zh ? '正在加载…' : 'Ring wird aufgebaut…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total
          ? (zh ? '正在启动游戏…' : 'Spiel startet…')
          : `${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
	          lastProgressAt = performance.now();
          // Load the boot binaries directly from the same static origin. The
          // distinct names deliberately bypass legacy storage/proxy mappings.
          const publicBootAssets = {
            'index.wasm': 'game-fc74679e3b97.wasm?v=fc74679e3b97-7d61b8ddd447',
            'index.pck': 'game-7d61b8ddd447.pck?v=fc74679e3b97-7d61b8ddd447'
          };
          const generatedFetch = window.fetch.bind(window);
          window.fetch = (input, init) => {
            const url = typeof input === 'string' ? input : (input && input.url) || '';
            const name = url.split('?')[0].split('/').pop();
            return publicBootAssets[name] ? generatedFetch(publicBootAssets[name], init) : generatedFetch(input, init);
          };
	          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          // Download completion alone is not engine readiness.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      // Position reporting is optional. Some browsers and embedded preview
      // proxies can reject the processor even though ordinary Web Audio works.
      // Keep SFX/music alive with a silent AudioNode fallback in that case.
      const installAudioWorkletFallback = () => {
        const NativeAudioWorkletNode = window.AudioWorkletNode;
        if (typeof NativeAudioWorkletNode === 'function' && !NativeAudioWorkletNode.__baldBrawlerFallback) {
          const SafeAudioWorkletNode = function (context, name, options) {
            try {
              return new NativeAudioWorkletNode(context, name, options);
            } catch (error) {
              if (name !== 'godot-position-reporting-processor' || !context || typeof context.createGain !== 'function') {
                throw error;
              }
              const fallback = context.createGain();
              fallback.port = { onmessage: null, postMessage: () => {} };
              fallback.parameters = new Map([['reset', { setValueAtTime: () => {} }]]);
              return fallback;
            }
          };
          SafeAudioWorkletNode.prototype = NativeAudioWorkletNode.prototype;
          SafeAudioWorkletNode.__baldBrawlerFallback = true;
          window.AudioWorkletNode = SafeAudioWorkletNode;
        }
        // Prevent a rejected addModule() promise from turning into an
        // unhandled Godot "Failed to create PositionWorklet" error.
        try {
          const probe = new (window.AudioContext || window.webkitAudioContext)();
          const worklet = probe.audioWorklet;
          const proto = worklet && Object.getPrototypeOf(worklet);
          if (proto && typeof proto.addModule === 'function' && !proto.__baldBrawlerFallback) {
            const nativeAddModule = proto.addModule;
            proto.addModule = function (...args) {
              return nativeAddModule.apply(this, args).catch(() => null);
            };
            proto.__baldBrawlerFallback = true;
          }
          probe.close();
        } catch (_) {
          // Audio may be unavailable until the first user gesture; Godot's
          // normal feature detection handles that case independently.
        }
      };
      installAudioWorkletFallback();
      const script = document.createElement('script');
      script.src = 'index.js';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
